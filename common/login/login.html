<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Student Marketplace and Rental</title>
  </head>
  <body>
    <header>
      <h1>Student Marketplace and Rental</h1>
      <h2>Login to Your Account</h2>
    </header>

    <main>
      <form action="" method="">
        <p>
          <label for="email">Email Address:</label><br />
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
          />
        </p>

        <p>
          <label for="password">Password:</label><br />
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            required
          />
        </p>

        <p>
          <label for="role">Login As:</label><br />
          <select id="role" name="role" required>
            <option value="">Select Your Role</option>
            <option value="student">Student</option>
            <option value="vendor">Vendor</option>
            <option value="admin">Admin</option>
            <option value="moderator">Moderator</option>
          </select>
        </p>

        <p>
          <button type="submit">Login</button>
          <button type="reset">Clear</button>
        </p>
      </form>

      <p>
        <a href="../Home page/home.html"> Back to Home </a>
      </p>
    </main>

    <footer>
      <p>&copy; 2026 Student Marketplace and Rental</p>
    </footer>
  </body>
</html>
