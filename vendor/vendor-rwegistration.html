<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vendor Registarion | Student marketplace and Rental</title>
  </head>
  <body>
    <header>
      <h1>Student Marketplae and rental</h1>
      <p>Your campus Your Marketplace</p>
      <hr />
    </header>

    <main>
      <h2>Vendor Registration</h2>
      <p>
        Create Your Vendor Account To sell Product and offer Rental Service...
      </p>
      <form action="">
        <fieldset>
          <legend>Personal Information</legend>
          <p>
            <label for="">Full Name:</label><br />
            <input type="text" placeholder="Enter Your Full Name" required />
          </p>

          <p>
            <label for="">Email Address:</label><br />
            <input type="email" placeholder="Enter Your Email" required />
          </p>
          <p>
            <label for="">Phone number:</label><br />
            <input type="tel" placeholder="Enter Your Phone number" required />
          </p>
          <p>
            <label for="">Student Id(Optional)</label><br />
            <input type="text" placeholder="Enter Your Student Id" />
          </p>
        </fieldset>
      </form>
    </main>
  </body>
</html>
