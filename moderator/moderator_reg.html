<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - UniHub</title>
    <link rel="stylesheet" href="reg_Css.css">
   <script src="reg.js" defer></script>
</head>
<body>

    <div class="container">
        <h1>Student Marketplace and Rental</h1>
        <p class="tagline"><em>Your Campus, Your Marketplace</em></p>

       <form id="regForm" action="#" method="post" novalidate>

            <h3>Personal Information</h3>
<label for="fullname">Full Name:</label>
<input type="text" id="fullname" name="fullname" placeholder="Enter your full name">
<span class="error" id="nameError"></span>

<label for="username">Username:</label>
<input type="text" id="username" name="username" placeholder="Choose a unique username">
<span class="error" id="usernameError"></span>

<label for="email">Email Address:</label>
<input type="email" id="email" name="email" placeholder="Enter your email">
<span class="error" id="emailError"></span>

<label for="phone">Phone Number:</label>
<input type="tel" id="phone" name="phone" placeholder="01XXXXXXXXX">
<span class="error" id="phoneError"></span>

<label for="department">Department:</label>
<input type="text" id="department" name="department" placeholder="e.g. CSE, EEE, Business">
<span class="error" id="departmentError"></span>

<label for="student_id">Student ID:</label>
<input type="text" id="student_id" name="student_id" placeholder="Enter student ID if available">
<span class="error" id="studentIdError"></span>

<label for="password">Password:</label>
<input type="password" id="password" name="password" placeholder="Minimum 6 characters">
<span class="error" id="passwordError"></span>

<label for="confirm_password">Confirm Password:</label>
<input type="password" id="confirm_password" name="confirm_password" placeholder="Repeat password">
<span class="error" id="confirmError"></span>

            <h3>Terms and Conditions</h3>

            <label class="terms">
                <input type="checkbox" id="terms" name="terms">
                I agree to the Terms and Conditions and confirm that the information provided is correct.
                I understand that all payments and handovers will be done face-to-face.
            </label>
            <span class="error" id="termsError"></span>

             <p id="formMessage"></p>

            <div class="buttons">
                <input type="submit" value="Register">
                <input type="reset" value="Clear Form">
            </div>

        </form>

        <p class="links">Already have an account? <a href="login.html">Login Here</a></p>
        <p class="links"><a href="home.html">← Back to Home</a></p>
    </div>

</body>
</html>
