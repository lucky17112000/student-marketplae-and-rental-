<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - UniHub</title>
    <link rel="stylesheet" href="reg_Css.css">
</head>
<body>

    <div class="container">
        <h1>Student Marketplace and Rental</h1>
        <p class="tagline"><em>Your Campus, Your Marketplace</em></p>

        <form action="#" method="post">

            <h3>Personal Information</h3>

            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>

            <label for="username">Username:</label>
            <input type="text" id="username" name="username" placeholder="Choose a unique username" required>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email (preferably university email)" required>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" placeholder="01XXXXXXXXX" required>

            <label for="department">Department / Faculty (for Students):</label>
            <input type="text" id="department" name="department" placeholder="e.g. CSE, EEE, Business">

            <label for="student_id">Student ID (optional for Members):</label>
            <input type="text" id="student_id" name="student_id" placeholder="Enter student ID if available">

            <h3>Account Security</h3>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Minimum 8 characters" required minlength="8">

            <label for="confirm_password">Confirm Password:</label>
            <input type="password" id="confirm_password" name="confirm_password" placeholder="Repeat password" required minlength="8">

            <h3>Terms and Conditions</h3>

            <label class="terms">
                <input type="checkbox" name="terms" required>
                I agree to the Terms and Conditions and confirm that the information provided is correct.
                I understand that all payments and handovers will be done face-to-face.
            </label>

            <div class="buttons">
                <input type="submit" value="Register">
                <input type="reset" value="Clear Form">
            </div>

        </form>

        <p class="links">Already have an account? <a href="login.html">Login Here</a></p>
        <p class="links"><a href="home.html">← Back to Home</a></p>
    </div>

</body>
</html>
