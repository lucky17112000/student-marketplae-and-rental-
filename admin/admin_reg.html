
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Registration | UniHub</title>
    <link rel="stylesheet" href="admin_reg.css">
</head>
<body>

    <header class="site-header">
        <h1>Student Marketplace and Rental</h1>
        <p>Your Campus, Your Marketplace</p>
    </header>

    <main class="main-content">
        <h2>Admin Registration</h2>
        <p class="intro-text">Create your UniHub Admin Account.</p>

        <form class="registration-form" action="" method="post">

            <fieldset>
                <legend>Personal Information</legend>

                <p>
                    <label for="fullName">Full Name:</label>
                    <input type="text" class="input-field" id="fullName" name="fullName" placeholder="Enter your full name" required>
                </p>

                <p>
                    <label for="username">Username:</label>
                    <input type="text" class="input-field" id="username" name="username" placeholder="Enter your username" required>
                </p>

                <p>
                    <label for="email">Email Address:</label>
                    <input type="email" class="input-field" id="email" name="email" placeholder="Enter your email" required>
                </p>

                <p>
                    <label for="phone">Phone Number:</label>
                    <input type="tel" class="input-field" id="phone" name="phone" placeholder="Enter your phone number" required>
                </p>
            </fieldset>

            <fieldset>
                <legend>Account Security</legend>

                <p>
                    <label for="password">Password:</label>
                    <input type="password" class="input-field" id="password" name="password" minlength="8" placeholder="Minimum 8 characters" required>
                </p>

                <p>
                    <label for="confirmPassword">Confirm Password:</label>
                    <input type="password" class="input-field" id="confirmPassword" name="confirmPassword" minlength="8" placeholder="Repeat password" required>
                </p>
            </fieldset>

            <fieldset>
                <legend>Terms and Conditions</legend>

                <p class="terms-row">
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms">
                        I agree to the Terms and Conditions
                        and confirm that the information
                        provided is correct.
                    </label>
                </p>
            </fieldset>

            <div class="form-buttons">
                <button type="submit" class="submit-button">Register as Admin</button>
                <button type="reset" class="reset-button">Clear Form</button>
            </div>

        </form>
    </main>

    <footer class="site-footer">
        <p>
            Already have an admin account?
            <a href="../common/login/login.html">Login Here</a>
        </p>
        <p>&copy; 2026 Student Marketplace and Rental</p>
    </footer>

</body>
</html>
